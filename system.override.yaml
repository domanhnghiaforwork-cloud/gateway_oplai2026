services:
  backend:
    environment:
      CHATBOT_SSO_SECRET: ${CHATBOT_SSO_SECRET:?Start using gateway start.ps1 to initialize SSO}
  frontend:
    environment:
      NEXT_PUBLIC_CHATBOT_SSO_ENABLED: "true"
      NEXT_PUBLIC_CHATBOT_URL: ${CHATBOT_URL:-https://larcher-brecken-palynologically.ngrok-free.dev/chatbot}
    ports: !override
      - "127.0.0.1:3001:3000"
    networks:
      default: {}
      shared:
        aliases: [system-web]

networks:
  shared:
    external: true
    name: oplai_gateway
