services:
  backend:
    ports: !override
      - "${SYSTEM_BACKEND_PORT:-8000}:8000"
    environment:
      CHATBOT_SSO_SECRET: ${CHATBOT_SSO_SECRET:?Start using gateway start.ps1 to initialize SSO}
      CHATBOT_ACCOUNT_SYNC_ENABLED: "true"
      CHATBOT_INTERNAL_URL: http://chatbot-api:8000
    networks:
      default: {}
      accounts: {}
      shared:
        aliases: [system-api]
  frontend:
    build:
      args:
        NEXT_PUBLIC_CHATBOT_SSO_ENABLED: "true"
        NEXT_PUBLIC_CHATBOT_URL: ${CHATBOT_URL:-/chatbot}
    environment:
      NEXT_PUBLIC_CHATBOT_SSO_ENABLED: "true"
      NEXT_PUBLIC_CHATBOT_URL: ${CHATBOT_URL:-https://larcher-brecken-palynologically.ngrok-free.dev/chatbot}
      CHATBOT_SSO_ENABLED: "true"
      CHATBOT_URL: ${CHATBOT_URL:-/chatbot}
    ports: !override
      - "127.0.0.1:${SYSTEM_FRONTEND_PORT:-3001}:3000"
    networks:
      default: {}
      shared:
        aliases: [system-web]

networks:
  accounts:
    external: true
    name: oplai_accounts
  shared:
    external: true
    name: oplai_gateway
