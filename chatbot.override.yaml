services:
  backend:
    environment:
      CHATBOT_SSO_SECRET: ${CHATBOT_SSO_SECRET:?Start using gateway start.ps1 to initialize SSO}
      CHATBOT_ACCOUNT_SYNC_ENABLED: "true"
    networks:
      default: {}
      accounts:
        aliases: [chatbot-api]
  frontend:
    build:
      args:
        NEXT_PUBLIC_BASE_PATH: /chatbot
    environment:
      NEXT_PUBLIC_BASE_PATH: /chatbot
      SYSTEM_SSO_ORIGINS: ${SYSTEM_SSO_ORIGINS:-}
    ports: !override
      - "127.0.0.1:${CHATBOT_FRONTEND_PORT:-3000}:3000"
    networks:
      default: {}
      shared:
        aliases: [chatbot-web]

networks:
  accounts:
    external: true
    name: oplai_accounts
  shared:
    external: true
    name: oplai_gateway
