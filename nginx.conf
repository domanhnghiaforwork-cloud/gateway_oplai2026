# Docker DNS resolves frontend containers again after they are recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ngrok terminates HTTPS before forwarding HTTP to this container.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep /chatbot: Next.js expects its configured basePath in the request.
    location = /chatbot {
        set $chatbot_upstream chatbot-web:3000;
        proxy_pass http://$chatbot_upstream;
        proxy_buffering off;
        proxy_cache off;
    }

    location ^~ /chatbot/ {
        set $chatbot_upstream chatbot-web:3000;
        proxy_pass http://$chatbot_upstream;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        set $system_upstream system-web:3000;
        proxy_pass http://$system_upstream;
    }
}
